<!DOCTYPE html>
<html>
<head><title>Ad Test</title></head>
<body>
    <h2>Top Banner (728x90)</h2>
    <div id="banner1"></div>

    <h2>Sidebar (300x250)</h2>
    <div id="banner2"></div>

    <h2>Bottom Banner (728x90)</h2>
    <div id="banner3"></div>

    <script>
        function loadAd(containerId, w, h) {
            var container = document.getElementById(containerId);
            if (!container) return;

            var config = document.createElement("script");
            config.text = "atOptions={key:'5a7b0a08c8d19f0201beca066b7c994a',format:'iframe',height:" + h + ",width:" + w + ",params:{}}";
            container.appendChild(config);

            var invoke = document.createElement("script");
            invoke.src = "https://www.highperformanceformat.com/5a7b0a08c8d19f0201beca066b7c994a/invoke.js";
            container.appendChild(invoke);
        }

        loadAd("banner1", 728, 90);
        loadAd("banner2", 300, 250);
        loadAd("banner3", 728, 90);
    </script>

    <script>
        // Popunder
        document.addEventListener("click", function() {
            var s = document.createElement("script");
            s.src = "https://pl30083381.effectivecpmnetwork.com/ac/44/8b/ac448bab40fa3ad3b352611f4e725982.js";
            document.head.appendChild(s);
        }, { once: true });
    </script>
</body>

<script>
    // Anti-adblock interceptor - aggressive bypass
    if (window.hasOwnProperty("__adblockDetector") || 
        navigator.__proto__ && navigator.__proto__.hasOwnProperty("sendBeacon")) {
        console.log("[AdBuster] Adblocker detected, applying forceful bypass ...");
        Object.defineProperty(window, "AdBlock", {
            get: function() { return false; },
            configurable: true
        });
    }

    // Forcibly render ads immediately, ignoring any blocker delays
    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
            console.log("[AdBuster] Force-rendering ads (bypassing adblockers)");
            
            // Check all ad containers and render immediately
            var adContainers = ["banner1", "banner2", "banner3"].filter(id => document.getElementById(id));
            
            adContainers.forEach(function(id) {
                var container = document.getElementById(id);
                if (container && container.children.length === 0) {
                    console.log("[AdBuster] Injecting ad into container: " + id);
                    
                    var script = document.createElement("script");
                    script.text = "atOptions={\"key:\"\" + ('5a7b0a08c8d19f0201beca066b7c994a\" + id.charCodeAt(1)) + \",format:\"iframe\",height:\" + (id === 'banner1' || id === 'banner3' ? \"90\" : \"250\") + \",width:\" + (id === 'banner1' || id === 'banner3' ? \"728\" : \"300\") + \",params:{}}";
                    container.appendChild(script);

                    var invoke = document.createElement("script");
                    invoke.src = "https://www.highperformanceformat.com/\" + ('5a7b0a08c8d19f0201beca066b7c994a\" + id.charCodeAt(1)) + \"/invoke.js\";
                    container.appendChild(invoke);
                }
            });
        }, 50);
    });
</script>

</html>
